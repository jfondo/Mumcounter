name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q MumCounter-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p MumCounter assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MumCounter-apk
          path: MumCounter/app/build/outputs/apk/debug/app-debug.apk
